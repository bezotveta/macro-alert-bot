name: macro-alerts

on:
  schedule:
    # Раз в час на 17-й минуте: GitHub массово пропускает запуски в начале часа.
    # Нам достаточно одного удачного старта на 6 часов: сам запуск живёт 5 ч 45 мин,
    # а лишние срабатывания встают в очередь благодаря concurrency ниже.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # держим бота живым 5 ч 45 мин, проверка календаря и команд каждую минуту
        run: timeout 20700 python bot.py --loop --interval 1 || true

      - name: Persist state
        if: always()
        run: |
          git config user.name "macro-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          git diff --quiet --cached || git commit -m "state: $(date -u +%FT%TZ)"
          git push || echo "push skipped"
