name: macro-alerts

on:
  schedule:
    # каждые 5 минут; GitHub иногда задерживает запуск на 5–10 минут
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Persist state
        run: |
          git config user.name "macro-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          git diff --quiet --cached || git commit -m "state: $(date -u +%FT%TZ)"
          git push || echo "push skipped"
